<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My DevOps Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            opacity: 0.9;
        }

        .btn {
            margin-top: 30px;
            padding: 12px 25px;
            background: white;
            color: #2a5298;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 Welcome to My DevOps Website</h1>
    <p>Deployed automatically using GitHub Actions & AWS S3</p>
    <a href="#" class="btn">Learn More</a>
</header>

<footer>
    © 2026 Meghesh | Built with GitHub Actions CI/CD
</footer>

</body>
</html>
